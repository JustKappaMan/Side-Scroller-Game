[project]
name = "side-scroller-game"
version = "1.0.0"
description = "Side-scroller game built with pygame"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9,<3.14"
dependencies = [
    "pygame>=2.6.1",
]

[project.scripts]
side-scroller-game = "side_scroller_game.__main__:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D213",
    "EM101",
    "EM102",
    "EM103",
    "FBT003",
    "S311",
]
